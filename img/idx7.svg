<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 480">
  <defs>
    <linearGradient id="sp1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1a1a1a"/><stop offset="100%" stop-color="#2d2d2d"/></linearGradient>
    <linearGradient id="cv1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#111111"/><stop offset="100%" stop-color="#0a0a0a"/></linearGradient>
    <filter id="sh1"><feDropShadow dx="6" dy="8" stdDeviation="10" flood-color="rgba(0,0,0,0.7)"/></filter>
  </defs>
  <g filter="url(#sh1)">
    <!-- Spine -->
    <rect x="10" y="20" width="52" height="440" rx="3" fill="url(#sp1)"/>
    <!-- Cover -->
    <rect x="58" y="10" width="300" height="455" rx="4" fill="url(#cv1)"/>
    <!-- Cover border -->
    <rect x="62" y="14" width="292" height="447" rx="3" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    <!-- Title -->
    <text x="208" y="168" font-family="serif" font-size="80" font-weight="900" fill="#FFE600" text-anchor="middle">电商</text>
    <text x="208" y="262" font-family="serif" font-size="80" font-weight="900" fill="#FFE600" text-anchor="middle">管理</text>
    <!-- Subtitle -->
    <text x="208" y="318" font-family="sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">电商卖家做大必学</text>
    <!-- Author -->
    <text x="208" y="400" font-family="sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">蒋晖  著</text>
    <!-- Publisher -->
    <text x="208" y="435" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">浙江摄影出版社</text>
    <!-- Spine text -->
    <text x="36" y="140" font-family="serif" font-size="12" fill="#FFE600" text-anchor="middle" writing-mode="tb-rl">电商管理·做大必学</text>
    <text x="36" y="380" font-family="serif" font-size="11" fill="#ccc" text-anchor="middle" writing-mode="tb-rl">蒋晖著</text>
    <!-- Top edge highlight -->
    <rect x="58" y="10" width="300" height="4" rx="2" fill="#333"/>
    <!-- Bottom edge -->
    <rect x="58" y="461" width="300" height="4" rx="2" fill="#1a1a1a"/>
  </g>
</svg>